<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HumanMap - 人际关系·家族图谱</title>
  <link rel="stylesheet" href="css/style.css"><!-- 分层入口：tokens → base → components → views -->
  <!-- Vue 本地化，不依赖 CDN。
       站点是 GitHub Pages 静态站，依赖 unpkg 意味着：
         - 用户网络到 unpkg 不通（部分国内网络）→ 整站白屏
         - unpkg 抖动或改版 → 整站白屏
         - 离线打开 → 整站白屏
       实测无头浏览器多次加载失败（`Vue is not defined`），
       页面完全不渲染。静态站的依赖必须随站发布。 -->
  <script src="vendor/vue.global.js"></script>
  <script src="vendor/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-inner">
        <router-link to="/" class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">HumanMap</span>
        </router-link>
        <div class="header-right">
          <router-link to="/all" class="btn btn-sm" style="margin-right:4px">全部对象</router-link>
          <a class="btn btn-sm" href="#/predicate" style="margin-right:8px">谓词表</a>
          <a class="btn btn-sm" href="#/detector" style="margin-right:8px">检测器</a>
          <a class="btn btn-sm" href="#/merge" style="margin-right:8px">归并审查</a>
          <a class="btn btn-sm" href="#/conflicts" style="margin-right:8px">数据分歧</a>
          <a class="btn btn-sm" href="#/sources" style="margin-right:8px">文献</a>
          <div class="mode-badge" :class="{ local: isLocalMode }">
            {{ isLocalMode ? '本地模式' : '只读模式' }}
          </div>
          <button class="btn-icon" @click="toggleTheme" :title="theme === 'light' ? '切换暗色主题' : '切换亮色主题'">
            {{ theme === 'light' ? '🌙' : '☀' }}
          </button>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">
      <router-view :key="$route.fullPath" :is-local="isLocalMode"></router-view>
    </main>

    <!-- 编辑器面板 -->
    <!-- 页脚 -->
    <footer class="app-footer">
      <span>HumanMap &copy; 2026</span>
      <span class="footer-sep">·</span>
      <span>人际关系与家族图谱分析系统</span>
      <span class="footer-sep">·</span>
      <span class="footer-stats" v-if="dataStats.loaded">
        👤 {{ dataStats.personCount }} 人物 · 🏛 {{ dataStats.orgCount }} 组织 · ⚔ {{ dataStats.eventCount }} 事件
      </span>
      <span class="footer-sep" v-if="dataStats.lastUpdate">·</span>
      <span v-if="dataStats.lastUpdate">更新于 {{ dataStats.lastUpdate }}</span>
    </footer>
  </div>

  <!-- 核心模块（无 Vue 依赖，可单独在 Node 中测试） -->
  <script src="js/core/predicates.js"></script>
  <script src="js/core/timeline.js"></script>
  <script src="js/core/data_store.js"></script>
  <!-- API client for the SQLite index. Loaded before services.js, which wires it
       in; nothing in js/core depends on it, so a static deploy can omit it. -->
  <script src="js/core/api.js"></script>
  <script src="js/core/relations.js"></script>
  <script src="js/core/search.js"></script>
  <script src="js/core/source_parser.js"></script>
  <script src="js/core/direction.js"></script>
  <script src="js/core/evidence.js"></script>
  <script src="js/core/graph_render.js"></script>
  <!-- 服务层：把 core 模块装配成组件可用的服务对象（无 Vue 组件） -->
  <script src="js/services.js"></script>
  <!-- Vue 组件（每个文件一个职责） -->
  <script src="js/views/search_bar.js"></script>
  <script src="js/views/home.js"></script>
  <!-- 详情页子组件。先于 entity_detail.js 加载：模板里引用它们。 -->
  <script src="js/views/entity/info_card.js"></script>
  <script src="js/views/entity/source_chain.js"></script>
  <script src="js/views/entity_detail.js"></script>
  <script src="js/views/family_tree.js"></script>
  <script src="js/views/all_objects.js"></script>
  <script src="js/views/search_results.js"></script>
  <script src="js/views/predicate_page.js"></script>
  <script src="js/views/source_page.js"></script>
  <script src="js/views/detector_page.js"></script>
  <script src="js/views/merge_review_page.js"></script>
  <script src="js/views/conflicts_page.js"></script>
  <!-- 装配入口：路由 + 根实例 + 挂载 -->
  <script src="js/app.js"></script>
</body>
</html>
