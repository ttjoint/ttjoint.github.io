<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HumanMap - 人际关系·家族图谱</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-inner">
        <router-link to="/" class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">HumanMap</span>
        </router-link>
        <div class="header-right">
          <router-link to="/all" class="btn btn-sm" style="margin-right:4px">全部对象</router-link>
          <button class="btn btn-sm" @click="openRelationPanel" v-if="isLocalMode" style="margin-right:8px">关系类型</button>
          <div class="mode-badge" :class="{ local: isLocalMode }">
            {{ isLocalMode ? '本地模式' : '只读模式' }}
          </div>
          <button class="btn-icon" @click="toggleTheme" :title="theme === 'light' ? '切换暗色主题' : '切换亮色主题'">
            {{ theme === 'light' ? '🌙' : '☀' }}
          </button>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">
      <router-view :key="$route.fullPath" :is-local="isLocalMode" @open-editor="openEditor"></router-view>
    </main>

    <!-- 编辑器面板 -->
    <editor-panel ref="editor" :is-local="isLocalMode" @close="onEditorClose" @saved="onEditorSaved"></editor-panel>

    <!-- 关系类型管理面板 -->
    <relation-panel ref="relationPanel" v-if="isLocalMode"></relation-panel>

    <!-- 页脚 -->
    <footer class="app-footer">
      <span>HumanMap &copy; 2026</span>
      <span class="footer-sep">·</span>
      <span>人际关系与家族图谱分析系统</span>
      <span class="footer-sep">·</span>
      <span class="footer-stats" v-if="dataStats.loaded">
        👤 {{ dataStats.personCount }} 人物 · 🏛 {{ dataStats.orgCount }} 组织 · ⚔ {{ dataStats.eventCount }} 事件
      </span>
      <span class="footer-sep" v-if="dataStats.lastUpdate">·</span>
      <span v-if="dataStats.lastUpdate">更新于 {{ dataStats.lastUpdate }}</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
