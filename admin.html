<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HumanMap 管理后台</title><style>body{font:14px system-ui;margin:0;background:#f5f6f8;color:#20252b}header{background:#202938;color:#fff;padding:16px 24px}main{max-width:1200px;margin:20px auto;padding:0 16px}.toolbar,.card{background:#fff;padding:16px;border-radius:8px;margin-bottom:16px;box-shadow:0 1px 4px #0001}input,select,textarea,button{padding:8px;margin:4px;border:1px solid #ccd3dc;border-radius:5px}button{cursor:pointer;background:#2867d8;color:#fff;border:0}.danger{background:#bd3030}.approve{background:#20843d}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}.muted{color:#687383}.review{border-left:4px solid #e1a400;padding:8px;margin:8px 0;background:#fff8df}.review pre{white-space:pre-wrap;max-height:180px;overflow:auto}</style></head><body><header><strong>HumanMap 管理后台</strong><span style="float:right" id="stats"></span></header><main><section class="toolbar"><button onclick="showReviews()">待审核候选</button><button onclick="load()">实体库</button><input id="q" placeholder="搜索名称…"><select id="type"><option value="">全部类型</option><option value="person">人物</option><option value="organization">组织</option><option value="event">事件</option></select><button onclick="load()">查询</button><button onclick="newEntity()">新增实体</button><button onclick="publish()">生成静态版本</button><span class="muted" id="msg">本地 SQLite 管理库</span></section><section class="card"><div id="content"></div></section><section class="card"><h3 id="title">编辑实体</h3><textarea id="editor" placeholder="JSON"></textarea><br><button onclick="save()">保存</button><button class="danger" onclick="remove()">删除</button></section></main><script>let current=null;const $=id=>document.getElementById(id);async function api(u,o){let r=await fetch(u,o);let x=await r.json();if(!r.ok)throw Error(x.error||r.status);return x}async function load(){let x=await api('/api/entities?q='+encodeURIComponent($('q').value)+'&type='+$('type').value);$('content').innerHTML='<table><tr><th>类型</th><th>名称</th><th>ID</th><th>操作</th></tr>'+x.map(e=>`<tr><td>${e.type}</td><td>${e.name}</td><td>${e.id}</td><td><button onclick='edit(${JSON.stringify(e.id)})'>编辑</button></td></tr>`).join('')+'</table>';$('stats').textContent=x.length+' 条结果'}async function showReviews(){let x=await api('/api/reviews?status=pending');$('content').innerHTML='<h3>待审核候选（'+x.length+'）</h3>'+x.map(r=>`<div class="review"><b>${r.name}</b> <span class="muted">${r.id}</span><p>来源批次：${r.source_batch}</p><pre>${JSON.stringify(r.data,null,2)}</pre><button class="approve" onclick='review(${JSON.stringify(r.id)},"approved")'>通过并入库</button><button class="danger" onclick='review(${JSON.stringify(r.id)},"rejected")'>驳回</button></div>`).join('')||'<p>暂无待审核记录</p>'}async function review(id,status){let note=prompt('审核备注（可选）')||'';await api('/api/reviews/'+encodeURIComponent(id),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({status,note})});showReviews()}async function edit(id){current=id;let x=await api('/api/entities/'+encodeURIComponent(id));$('title').textContent='编辑 '+x.name;$('editor').value=JSON.stringify(x,null,2)}function newEntity(){current=null;$('title').textContent='新增实体';$('editor').value=JSON.stringify({id:'person:'+crypto.randomUUID().replaceAll('-','').slice(0,20),name:'',type:'person',props:{},aliases:[],tags:[],relations:{},sources:[]},null,2)}async function save(){try{let x=JSON.parse($('editor').value);await api('/api/entities'+(current?'/'+encodeURIComponent(current):''),{method:current?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)});$('msg').textContent='已保存';load()}catch(e){$('msg').textContent=e.message}}async function remove(){if(!current||!confirm('确认删除？'))return;await api('/api/entities/'+encodeURIComponent(current),{method:'DELETE'});$('editor').value='';load()}async function publish(){try{let x=await api('/api/publish',{method:'POST'});$('msg').textContent=x.message}catch(e){$('msg').textContent=e.message}}load()</script></body></html>
